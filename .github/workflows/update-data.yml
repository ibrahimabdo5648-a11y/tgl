name: Update live departure data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Download live data
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          url = "https://v6.vbb.transport.rest/stops/900089303/departures?duration=120&results=100&remarks=true&language=de"

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.loads(r.read().decode("utf-8"))

          departures = data.get("departures", data)

          result = []

          now = datetime.now(timezone.utc)

          for x in departures:
              line = x.get("line") or {}
              name = str(line.get("name", ""))

              direction = (
                  x.get("direction")
                  or x.get("destination", {}).get("name", "")
                  or ""
              )

              when = x.get("when") or x.get("plannedWhen")

              if not when:
                  continue

              try:
                  dt = datetime.fromisoformat(
                      when.replace("Z", "+00:00")
                  )
              except:
                  continue

              if dt <= now:
                  continue

              if name.upper().startswith("S25") and "TELTOW" in direction.upper():
                  result.append({
                      "time": dt.timestamp(),
                      "line": "S25",
                      "destination": "TELTOW STADT"
                  })

              if "KURT-SCHUMACHER-PLATZ" in direction.upper():
                  result.append({
                      "time": dt.timestamp(),
                      "line": "U6",
                      "destination": "KURT-SCHUMACHER-PLATZ"
                  })

          result.sort(key=lambda x: x["time"])

          output = []

          for x in result[:5]:
              minutes = int((x["time"] - now.timestamp()) / 60)

              if minutes <= 0:
                  countdown = "JETZT"
              else:
                  countdown = str(minutes) + " MIN"

              output.append({
                  "line": x["line"],
                  "destination": x["destination"],
                  "countdown": countdown
              })

          try:
              weather_url = "https://api.open-meteo.com/v1/forecast?latitude=52.56&longitude=13.29&current=temperature_2m"
              req = urllib.request.Request(
                  weather_url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(req, timeout=30) as r:
                  weather = json.loads(r.read().decode("utf-8"))

              temperature = str(
                  round(weather["current"]["temperature_2m"])
              )
          except:
              temperature = "--"

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump({
                  "temperature": temperature,
                  "departures": output
              }, f, ensure_ascii=False, indent=2)
          PY

      - name: Save updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update live departure data"
          git push
