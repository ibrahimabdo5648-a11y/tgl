name: Update live departure data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Download live data
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          # S Tegel
          s25_data = get_json(
              "https://v6.vbb.transport.rest/stops/900089303/departures"
              "?duration=180&results=100&remarks=true&language=de"
          )

          # U Alt-Tegel
          u6_data = get_json(
              "https://v6.vbb.transport.rest/stops/900089301/departures"
              "?duration=180&results=100&remarks=true&language=de"
          )

          now = datetime.now(timezone.utc)
          departures = []

          def process(data, station_type):
              items = data.get("departures", data)

              for x in items:
                  line = x.get("line") or {}

                  line_name = str(
                      line.get("name")
                      or x.get("line")
                      or ""
                  )

                  direction = str(
                      x.get("direction")
                      or (x.get("destination") or {}).get("name", "")
                      or x.get("destination")
                      or ""
                  )

                  when = (
                      x.get("when")
                      or x.get("plannedWhen")
                      or x.get("scheduledWhen")
                  )

                  if not when:
                      continue

                  try:
                      dt = datetime.fromisoformat(
                          when.replace("Z", "+00:00")
                      )
                  except:
                      continue

                  if dt <= now:
                      continue

                  # S25 -> Teltow Stadt
                  if (
                      station_type == "s25"
                      and line_name.upper().startswith("S25")
                      and "TELTOW" in direction.upper()
                  ):
                      departures.append({
                          "time": dt.isoformat(),
                          "line": "S25",
                          "destination": "TELTOW STADT"
                      })

                  # Replacement bus -> Kurt-Schumacher-Platz
                  if (
                      station_type == "u6"
                      and "KURT-SCHUMACHER-PLATZ"
                      in direction.upper()
                  ):
                      departures.append({
                          "time": dt.isoformat(),
                          "line": "U6",
                          "destination": "KURT-SCHUMACHER-PLATZ"
                      })

          process(s25_data, "s25")
          process(u6_data, "u6")

          # Sort all departures together
          departures.sort(key=lambda x: x["time"])

          # Keep more than the 5 currently displayed
          departures = departures[:20]

          # Weather
          try:
              weather = get_json(
                  "https://api.open-meteo.com/v1/forecast"
                  "?latitude=52.56&longitude=13.29"
                  "&current=temperature_2m"
              )

              temperature = weather["current"]["temperature_2m"]

          except Exception:
              temperature = None

          output = {
              "updated": datetime.now(timezone.utc).isoformat(),
              "temperature": temperature,
              "departures": departures
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )
          PY

      - name: Save updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update live departure data"
          git push
