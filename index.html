<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tegel Abfahrtsanzeige</title>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#050505;
  color:#ffb52a;
  overflow:hidden;
  font-family:"Courier New",monospace;
  font-weight:bold;
}

#board{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at center,rgba(255,170,20,.06),transparent 65%),
    #050505;
}

/* HEADER */
#head{
  height:14%;
  display:grid;
  grid-template-columns:20% 45% 35%;
  align-items:center;
  padding:0 3%;
  box-sizing:border-box;
  border-bottom:2px solid #ffb52a;
  font-size:30px;
  letter-spacing:2px;
  text-shadow:
    0 0 4px #ffb52a,
    0 0 10px rgba(255,181,42,.45);
}

.right{
  text-align:right;
}

/* DEPARTURES */
#rows{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:space-around;
  padding:2% 3%;
  box-sizing:border-box;
}

.row{
  display:grid;
  grid-template-columns:20% 55% 25%;
  align-items:center;
  min-height:13%;
  font-size:30px;
  letter-spacing:2px;
  text-shadow:
    0 0 4px #ffb52a,
    0 0 9px rgba(255,181,42,.4);
}

.row:nth-child(even){
  background:rgba(255,181,42,.025);
}

.count{
  text-align:right;
  font-size:32px;
}

/* BOTTOM INFORMATION */
#info{
  height:9%;
  display:flex;
  align-items:center;
  padding:0 3%;
  box-sizing:border-box;
  border-top:2px solid #ffb52a;
  font-size:19px;
  letter-spacing:1px;
  text-shadow:
    0 0 4px #ffb52a,
    0 0 8px rgba(255,181,42,.35);
}

#clock{
  display:inline-block;
  min-width:75px;
  margin-right:25px;
}

#weather{
  display:inline-block;
  min-width:85px;
  margin-right:30px;
}

#quote{
  flex:1;
  text-align:center;
  white-space:nowrap;
  overflow:hidden;
}

/* FULLSCREEN BUTTON */
#fs{
  position:fixed;
  right:8px;
  bottom:8px;
  width:34px;
  height:34px;
  background:#050505;
  color:#ffb52a;
  border:1px solid #ffb52a;
  font-size:20px;
  line-height:28px;
  padding:0;
  opacity:.8;
}

/* OLD TABLETS */
@media(max-width:700px){
  #head{
    font-size:23px;
    letter-spacing:1px;
  }

  .row{
    font-size:23px;
    letter-spacing:1px;
  }

  .count{
    font-size:25px;
  }

  #info{
    font-size:16px;
  }
}
</style>
</head>

<body>
<div id="board">

<div id="head">
<div>LINIE</div>
<div>ZIEL</div>
<div class="right">ABFAHRT IN</div>
</div>

<div id="rows">
<div class="row"><div>--</div><div>LIVE DATEN</div><div class="count">--</div></div>
<div class="row"><div>--</div><div></div><div class="count">--</div></div>
<div class="row"><div>--</div><div></div><div class="count">--</div></div>
<div class="row"><div>--</div><div></div><div class="count">--</div></div>
<div class="row"><div>--</div><div></div><div class="count">--</div></div>
</div>

<div id="info">
<span id="clock">--:--</span>
<span id="weather">--°C</span>
<span id="quote">„Jeder Weg beginnt mit dem ersten Schritt.“</span>
</div>

<button id="fs">⛶</button>

</div>

<script>
var dataUrl="data.json";

function loadData(){
  var x=new XMLHttpRequest();

  x.open("GET",dataUrl+"?t="+new Date().getTime(),true);

  x.onreadystatechange=function(){
    if(x.readyState===4){
      if(x.status===200){
        try{
          var d=JSON.parse(x.responseText);
          showData(d);
        }catch(e){
          showError();
        }
      }else{
        showError();
      }
    }
  };

  x.send(null);
}

function showData(d){
  var rows=document.getElementById("rows");
  var list=d.departures||[];

  if(list.length===0){
    showError();
    return;
  }

  var html="";

  for(var i=0;i<5;i++){
    if(list[i]){
      html+='<div class="row">';
      html+='<div>'+list[i].line+'</div>';
      html+='<div>'+list[i].destination+'</div>';
var departureTime = new Date(list[i].time).getTime();
var now = new Date().getTime();
var minutes = Math.floor((departureTime - now) / 60000);

var countdown;

if(minutes <= 0){
  countdown = "JETZT";
}else{
  countdown = minutes + " MIN";
}

html+='<div class="count">'+countdown+'</div>';
      html+='</div>';
    }else{
      html+='<div class="row"><div></div><div></div><div></div></div>';
    }
  }

  rows.innerHTML=html;

  if(d.temperature !== null && d.temperature !== undefined){
    document.getElementById("weather").innerHTML=d.temperature+"°C";
  }
}

function showError(){
  document.getElementById("rows").innerHTML=
  '<div class="row"><div></div><div>LIVE-DATEN NICHT VERFÜGBAR</div><div></div></div>';
}

function clock(){
  var d=new Date();

  var h=("0"+d.getHours()).slice(-2);
  var m=("0"+d.getMinutes()).slice(-2);

  document.getElementById("clock").innerHTML=h+":"+m;
}

function fullscreen(){
  var e=document.documentElement;

  if(e.requestFullscreen){
    e.requestFullscreen();
  }else if(e.webkitRequestFullscreen){
    e.webkitRequestFullscreen();
  }
}

document.getElementById("fs").onclick=fullscreen;

clock();
setInterval(clock,1000);

loadData();
setInterval(loadData,60000);
</script>

</body>
</html>
