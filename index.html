<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tegel Abfahrtsanzeige</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;color:#ffad18;overflow:hidden}
body{font-family:"Courier New",monospace;font-weight:bold}
#board{width:100%;height:100%;display:flex;flex-direction:column}
#head{height:15%;display:grid;grid-template-columns:20% 55% 25%;align-items:center;border-bottom:2px solid #ffad18;padding:0 3%;font-size:28px}
.right{text-align:right}
#rows{flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:2%}
.row{display:grid;grid-template-columns:20% 55% 25%;font-size:27px}
.count{text-align:right}
#info{ height:8%; display:flex; align-items:center; padding:0 3%; font-size:18px; }  #clock{ display:inline-block; min-width:75px; margin-right:25px; }  #weather{ display:inline-block; min-width:85px; margin-right:30px; }  #quote{ flex:1; text-align:center; white-space:nowrap; overflow:hidden; }
#quote{flex:1;text-align:center;white-space:nowrap;overflow:hidden}
#fs{position:fixed;right:8px;bottom:8px;background:#050505;color:#ffad18;border:1px solid #ffad18;font-size:20px}
</style>
</head>

<body>
<div id="board">

<div id="head">
<div>LINIE</div>
<div>ZIEL</div>
<div class="right">ABFAHRT IN</div>
</div>

<div id="rows">
<div class="row"><div>--</div><div>LIVE DATEN</div><div class="count">--</div></div>
<div class="row"><div>--</div><div></div><div class="count">--</div></div>
<div class="row"><div>--</div><div></div><div class="count">--</div></div>
<div class="row"><div>--</div><div></div><div class="count">--</div></div>
<div class="row"><div>--</div><div></div><div class="count">--</div></div>
</div>

<div id="info">
<span id="clock">--:--</span>
<span id="weather">--°C</span>
<span id="quote">„Jeder Weg beginnt mit dem ersten Schritt.“</span>
</div>

<button id="fs">⛶</button>

</div>

<script>
var dataUrl="data.json";

function loadData(){
  var x=new XMLHttpRequest();

  x.open("GET",dataUrl+"?t="+new Date().getTime(),true);

  x.onreadystatechange=function(){
    if(x.readyState===4){
      if(x.status===200){
        try{
          var d=JSON.parse(x.responseText);
          showData(d);
        }catch(e){
          showError();
        }
      }else{
        showError();
      }
    }
  };

  x.send(null);
}

function showData(d){
  var rows=document.getElementById("rows");
  var list=d.departures||[];

  if(list.length===0){
    showError();
    return;
  }

  var html="";

  for(var i=0;i<5;i++){
    if(list[i]){
      html+='<div class="row">';
      html+='<div>'+list[i].line+'</div>';
      html+='<div>'+list[i].destination+'</div>';
var departureTime = new Date(list[i].time).getTime();
var now = new Date().getTime();
var minutes = Math.floor((departureTime - now) / 60000);

var countdown;

if(minutes <= 0){
  countdown = "JETZT";
}else{
  countdown = minutes + " MIN";
}

html+='<div class="count">'+countdown+'</div>';
      html+='</div>';
    }else{
      html+='<div class="row"><div></div><div></div><div></div></div>';
    }
  }

  rows.innerHTML=html;

  if(d.temperature !== null && d.temperature !== undefined){
    document.getElementById("weather").innerHTML=d.temperature+"°C";
  }
}

function showError(){
  document.getElementById("rows").innerHTML=
  '<div class="row"><div></div><div>LIVE-DATEN NICHT VERFÜGBAR</div><div></div></div>';
}

function clock(){
  var d=new Date();

  var h=("0"+d.getHours()).slice(-2);
  var m=("0"+d.getMinutes()).slice(-2);

  document.getElementById("clock").innerHTML=h+":"+m;
}

function fullscreen(){
  var e=document.documentElement;

  if(e.requestFullscreen){
    e.requestFullscreen();
  }else if(e.webkitRequestFullscreen){
    e.webkitRequestFullscreen();
  }
}

document.getElementById("fs").onclick=fullscreen;

clock();
setInterval(clock,1000);

loadData();
setInterval(loadData,60000);
</script>

</body>
</html>
